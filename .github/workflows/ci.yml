name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: go-src/go.mod
      - run: go mod tidy
      - run: go test ./...
      - run: go vet ./...

  web:
    name: Next.js lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --exit-code 1


  dependency-and-filesystem-scan:
    name: Dependency and filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Go vulnerability scan
        run: docker run --rm -v "$PWD:/workspace" -w /workspace golang:1.26 sh -lc 'go install golang.org/x/vuln/cmd/govulncheck@latest && cd go-src && go mod tidy && govulncheck ./...'
      - name: Trivy filesystem scan
        run: docker run --rm -v "$PWD:/workspace" -w /workspace aquasec/trivy:0.66.0 fs --scanners vuln,secret,misconfig --ignore-unfixed .
      - name: Generate SBOM
        run: docker run --rm -v "$PWD:/workspace" -w /workspace anchore/syft:1.35.0 dir:. -o spdx-json=alfa-panel-sbom.spdx.json
