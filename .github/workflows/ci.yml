name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go-src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.26.9"
          cache-dependency-path: go-src/go.sum
      - run: go mod tidy
      - run: go test ./...
      - run: go vet ./...

  web:
    name: Next.js lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: bun ci
      - run: npm run lint
      - run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect --source=/repo --redact --exit-code 1

  dependency-and-filesystem-scan:
    name: Dependency and filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Go vulnerability scan
        run: docker run --rm -v "$PWD:/workspace" -w /workspace golang:1.26 sh -c 'go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && cd go-src && go mod tidy && govulncheck ./...'
      - name: Trivy filesystem scan
        run: docker run --rm -v "$PWD:/workspace" -w /workspace aquasec/trivy:0.66.0 fs --scanners vuln,secret,misconfig --ignore-unfixed .
      - name: Verify systemd units
        run: systemd-analyze verify deploy/alfa-panel-agent.service deploy/alfa-panel-api.service deploy/alfa-panel-acme.service deploy/alfa-panel-acme.timer deploy/alfa-panel-backup-retention.service deploy/alfa-panel-backup-retention.timer
      - name: Generate SBOM
        run: docker run --rm -v "$PWD:/workspace" -w /workspace anchore/syft:1.35.0 dir:. -o spdx-json=alfa-panel-sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alfa-panel-sbom
          path: alfa-panel-sbom.spdx.json

  disposable-e2e:
    name: Disposable Docker E2E
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run disposable lifecycle test
        run: bash scripts/e2e-disposable.sh
